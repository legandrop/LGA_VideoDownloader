# Configuracion de publicacion de esta app para tools/macos/publish_release.sh (la pieza
# canonica de LGA_Base_QT_C_Py). Solo variables: la logica vive en la pieza. Parametros en
# ../LGA_Base_QT_C_Py/docs/Doc_Deploy_macOS.md §5.
#
# Los nombres de los artefactos NO se cambian: los buscan el auto-update de las copias instaladas
# (productId LGA_Video_Downloader en macOS, VideoDownloader en Windows) y el manifiesto de LGA_Updates.
APP_NAME="LGA Video Downloader"
ARTIFACT_NAME="LGA_Video_Downloader"
RELEASE_REPO="legandrop/LGA_VideoDownloader"
# La version va de a milesimos (1.000, 1.001...) y sale de VERSION, que el bump escribe junto con
# CMakeLists.txt. Se aceptan dos decimales solo por la ultima publicada antes del cambio de
# numeracion (0.95): sin eso, `--decide` cortaria antes de poder ofrecer el bump a 1.000.
# `--check` sale con error si CMakeLists.txt, VERSION y el changelog no dicen lo mismo o si el bump
# no esta commiteado.
VERSION_REGEX='^[0-9]+\.[0-9]{2,3}$'
VERSION_CHECK_CMD="sh ./bump_version.sh --check"
# Para `--decide`: la version en desarrollo es la que encabeza el changelog, y el bump la sube a
# CMakeLists.txt y VERSION con commit + push, sin ofrecer publicar (de eso se encarga deploy.sh).
DEV_VERSION_FILE="docs/ChangeLog.md"
BUMP_CMD="sh ./bump_version.sh --commit --no-publish"
# Todo release lleva SHA256SUMS con las lineas de TODOS los assets de update: el updater viejo de las
# copias v0.95 no ofrece el update sin la linea de su asset. El instalador de Windows no sigue
# ARTIFACT_NAME (instalador.bat).
SHA256SUMS=true
WIN_ASSET="VideoDownloader_Setup_v{v}.exe"
WHATS_NEW_FILE="docs/WhatsNew.md"
# El mismo cuerpo que pone instalador.bat al crear el release; lo pisan las notas (What's new).
RELEASE_NOTES="LGA Video Downloader v{v}"
